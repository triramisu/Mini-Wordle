<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mini Wordle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="bg-dark text-light d-flex flex-column align-items-center justify-content-start min-vh-100 py-4">

<h1 class="fw-bold mb-3 text-uppercase" style="letter-spacing: 2px;">Mini Wordle</h1>

<div id="loadingMsg" class="alert alert-secondary text-center px-4 py-2 small" style="max-width: 400px;">
    Đang tải dữ liệu...
</div>

<div id="msg" class="h5 mb-3 fw-bold text-center" style="height: 24px;"></div>

<div id="board" class="mb-4"></div>

<div id="keyboard" class="mb-4 w-100 px-2" style="max-width: 500px;"></div>

<div class="d-flex gap-3 mt-2">
    <button id="newGame" class="btn btn-outline-light fw-bold px-4" disabled>Chơi lại</button>
    <button id="showFlashcards" class="btn btn-warning fw-bold px-4 text-dark">Ôn tập Flashcard</button>
</div>

<div class="modal fade" id="flashcardModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-secondary text-light shadow-lg border-0">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold">Flashcard</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center py-4">
                <div class="bg-dark rounded p-5 mb-4 shadow-sm border border-secondary">
                    <h1 id="fcWord" class="display-3 fw-bold text-uppercase text-white mb-3"></h1>
                    <a id="fcLink" target="_blank" class="btn btn-outline-info rounded-pill px-4">Tra nghĩa</a>
                </div>
                <div class="d-flex justify-content-center gap-3">
                    <button id="fcLearned" class="btn btn-success fw-bold px-4">Đã thuộc (Xoá)</button>
                    <button id="fcNext" class="btn btn-light fw-bold px-4 text-dark">Từ tiếp theo</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/mainWordle.js}"></script>
</body>
